<div class="admin-layout" [class.collapsed]="isSidebarCollapsed">
  
  <!-- Use the reusable sidebar component here -->
  <app-sidebar 
    [activeMenu]="'dashboard'" 
    (collapsedChange)="isSidebarCollapsed = $event">
  </app-sidebar>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <main class="main-content">
    
    <!-- Topbar -->
    <header class="topbar">
      <!-- (Keep the exact same Topbar code from the previous step here) -->
      <div class="search-bar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6c757d" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" placeholder="Search">
      </div>
      <div class="topbar-actions">
        <div class="user-profile">
          <img src="https://ui-avatars.com/api/?name=Sarah+Jenkins&background=dc3545&color=fff" alt="User" class="avatar">
          <div class="user-info">
            <span class="user-name">Sarah Jenkins</span>
            <span class="user-role">Admin</span>
          </div>
        </div>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="page-header">
        <h1>Dashboard Overview</h1>
        <p>October 26, 2023</p>
      </div>
    </div>

  </main>
</div>
