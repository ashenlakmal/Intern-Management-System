<div class="login-container">
  <div class="login-card">
    
    <!-- Logo and Title -->
    <div class="header">
      <div class="logo">
        <div class="logo-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        </div>
        <div class="logo-text">
          <h2>Internship</h2>
          <p>Management System</p>
        </div>
      </div>
      <h1 class="welcome-text">Welcome Back</h1>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onSubmit()">
      
      <div class="input-group">
        <label>Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
          <input type="email" placeholder="Email Address" [(ngModel)]="email" name="email" required>
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-wrapper">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required>
        </div>
      </div>

      <!-- Submit Button with Loading State -->
      <button type="submit" [disabled]="isLoading" class="login-btn">
        <span *ngIf="!isLoading">Log in</span>
        <span *ngIf="isLoading" class="loading-state">
          <svg class="spinner" viewBox="0 0 50 50"><circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle></svg>
          Logging in...
        </span>
      </button>

      <div class="form-footer">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

    </form>

    <div class="signup-link">
      Don't have an account? <a href="#">Sign Up</a>
    </div>

  </div>
</div>
